proxy-providers:
  "Provide-Game":
    type: file
    path: ./provide/subscription.yaml
    filter: "(Game|游戏|IPLC)"

  "Provide-Gemini":
    type: file
    path: ./provide/subscription.yaml
    filter: '\[(GEM|Gemini)\].*(美国|美國|🇺🇸|United States|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(^|[^A-Za-z])[Uu][Ss][Aa]?([^A-Za-z]|$))|(美国|美國|🇺🇸|United States|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(^|[^A-Za-z])[Uu][Ss][Aa]?([^A-Za-z]|$)).*\[(GEM|Gemini)\]'

  "Provide-HK":
    type: file
    path: ./provide/subscription.yaml
    filter: '.*香港.*' # Supports regular expressions to filter by node name
    # exclude-filter: 'ctb' # Supports regular expressions to exclude based on node name
    # exclude-type: 'ss|http' # Does not support regular expressions, separated by '|', excluded by node type
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 3600

  "Provide-TW":
    type: file
    path: ./provide/subscription.yaml
    filter: '.*台湾.*' # Supports regular expressions to filter by node name
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 3600

  "Provide-SG":
    type: file
    path: ./provide/subscription.yaml
    filter: '.*新加坡.*' # Supports regular expressions to filter by node name
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 3600

  "Provide-JP":
    type: file
    path: ./provide/subscription.yaml
    filter: '.*日本.*' # Supports regular expressions to filter by node name
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 3600

  "Provide-US":
    type: file
    path: ./provide/subscription.yaml
    filter: '.*美国.*' # Supports regular expressions to filter by node name
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 3600

  # "provide-cloud":
