proxy-groups:
  - name: 🇭🇰 Auto-HK
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - "Provide-HK"
  - name: 🇺🇲 Auto-US
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    use:
      - "Provide-US"
  - name: 🇨🇳 Auto-TW
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - "Provide-TW"
  - name: 🇯🇵 Auto-JP
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - "Provide-JP"
  - name: 🇸🇬 Auto-SG
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - "Provide-SG"
  - name: 🇭🇰 HK
