# Stash 原生拆分配置；不再交给 subconverter 合并规则。
# 使用前：在 Stash 本地覆写中设置 proxy-providers.subscription.url。
# 公共配置保留占位地址；真实订阅链接勿提交到仓库。
# 订阅响应必须是包含 proxies: 的 YAML；其他格式需先仅转换节点。
# 节点每小时更新，规则每天更新；策略组和匹配顺序在本文件维护。
# 原 rule.ini 保留。规则直接读取 GitHub 原始地址（可能与 ruleset/ 本地内容不同）。
# Stash 空代理集/空策略组会按 DIRECT 处理；导入后务必检查各地区有节点。
# 地区筛选保留原有正则（含负向前瞻），需在实际 Stash 版本确认筛选结果。
# Stash 节点测速结果跨组共享，原 Smart 组不代表流媒体解锁检测。
mode: rule
log-level: info
ipv6: true

# 所有策略组共用一个订阅；各组通过 filter 按节点名称筛选。
proxy-providers:
  subscription:
    url: "https://example.invalid/REPLACE_WITH_YOUR_STASH_SUBSCRIPTION"
    interval: 3600

proxy-groups:
  - name: "🚀 Global"
    type: select
    proxies:
      - "🇭🇰 Auto-HK"
      - "🇨🇳 Auto-TW"
      - "🇺🇲 Auto-US"
      - "🇯🇵 Auto-JP"
      - "🇸🇬 Auto-SG"
      - "DIRECT"
  - name: "💬 Intelligence"
    type: url-test
    use:
      - subscription
    # 只选择通过 iOS ChatGPT 预检的新加坡节点。
    filter: '^\[GPT\].*(新加坡|坡|狮城|[Ss][Gg]|[Ss]ingapore)'
    url: "http://www.gstatic.com/generate_204"
    interval: 600
    tolerance: 100
    lazy: true
  - name: "🏃 Apple Fitness"
    type: select
    proxies:
      - "🇭🇰 Auto-HK"
      - "🇸🇬 Auto-SG"
      - "🇺🇲 Auto-US"
      - "🇯🇵 Auto-JP"
      - "🇨🇳 Auto-TW"
      - "DIRECT"
  - name: "📺 Apple TV"
    type: select
    proxies:
      - "🇺🇲 Auto-US"
      - "🇯🇵 Auto-JP"
      - "🇭🇰 Auto-HK"
      - "🇸🇬 Auto-SG"
  - name: "🍎 Apple"
    type: select
    proxies:
      - "DIRECT"
      - "🇭🇰 Auto-HK"
      - "🇸🇬 Auto-SG"
      - "🇯🇵 Auto-JP"
      - "🇺🇲 Auto-US"
  - name: "🌍 Google"
    type: select
    proxies:
      - "🇭🇰 Auto-HK"
      - "🇨🇳 Auto-TW"
      - "🇺🇲 Auto-US"
      - "🇯🇵 Auto-JP"
      - "🇸🇬 Auto-SG"
  - name: "🎮 Game"
    type: select
    proxies:
      - "🚀 Global"
      - "DIRECT"
    use:
      - subscription
    filter: "^(?:🚀 Global|DIRECT)$|(Game|游戏|IPLC)"
  - name: "💰 PayPal"
    type: select
    proxies:
      - "🇺🇲 Auto-US"
      - "DIRECT"
  - name: "🛍️ Amazon"
    type: select
    proxies:
      - "🇺🇲 Auto-US"
      - "🇯🇵 Auto-JP"
      - "DIRECT"
  - name: "📺 YouTube"
    type: select
    proxies:
      - "📺 YouTube-Smart"
      - "🚀 Global"
  - name: "📺 Netflix"
    type: select
    proxies:
      - "📺 Netflix-Smart"
      - "🚀 Global"
  - name: "📺 DisneyPlus"
    type: select
    proxies:
      - "📺 DisneyPlus-Smart"
      - "🚀 Global"
  - name: "🎯 Mainland"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 Global"
  - name: "🛑 Advertising"
    type: select
    proxies:
      - "REJECT"
      - "DIRECT"
  - name: "🐟 Final"
    type: select
    proxies:
      - "🚀 Global"
      - "DIRECT"
  - name: "🇭🇰 Auto-HK"
    type: url-test
    use:
      - subscription
    filter: "^(?!.*(Game|游戏|IPLC)).*(港|HK|hk|Hong Kong|HongKong|hongkong).*"
    interval: 300
    lazy: true
  - name: "🇺🇲 Auto-US"
    type: url-test
    use:
      - subscription
    filter: "^(?!.*(Game|游戏|IPLC)).*(美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States).*"
    interval: 300
    lazy: true
  - name: "🇨🇳 Auto-TW"
    type: url-test
    use:
      - subscription
    filter: "^(?!.*(Game|游戏|IPLC)).*(台|新北|彰化|TW|Taiwan).*"
    interval: 300
    lazy: true
  - name: "🇯🇵 Auto-JP"
    type: url-test
    use:
      - subscription
    filter: "^(?!.*(Game|游戏|IPLC)).*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan).*"
    interval: 300
    lazy: true
  - name: "🇸🇬 Auto-SG"
    type: url-test
    use:
      - subscription
    filter: "^(?!.*(Game|游戏|IPLC)).*(新加坡|坡|狮城|SG|Singapore).*"
    interval: 300
    lazy: true
  - name: "📺 YouTube-Smart"
    type: url-test
    use:
      - subscription
    filter: "^(?!.*(Game|游戏|IPLC)).*(港|HK|Hong Kong).*"
    interval: 1800
    lazy: true
  - name: "📺 Netflix-Smart"
    type: url-test
    use:
      - subscription
    filter: "^(?!.*(Game|游戏|IPLC)).*(港|HK|Hong Kong).*"
    interval: 1800
    lazy: true
  - name: "📺 DisneyPlus-Smart"
    type: url-test
    use:
      - subscription
    filter: "^(?!.*(Game|游戏|IPLC)).*(台|TW|Taiwan).*"
    interval: 1800
    lazy: true

